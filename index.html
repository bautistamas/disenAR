<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseña lo que viene</title>
<meta name="theme-color" content="#1f2449">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Diseña">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Concepto: app móvil de la campaña "Diseña lo que viene" (Tinta Brava). Una sola estética de marca:
   navy + rosa, Public Sans, líneas punteadas, trama de puntos y cuadrícula milimetrada del tríptico. */
:root{
  --navy:#1f2449; --rosa:#d66fa9; --amarillo:#fbce00; --verde:#93ab6a;
  --papel:#ffffff; --gris:#f3f3f6; --error:#8a1f55; --errorbg:#fdf0f6; --ok:#4d6a2a;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--navy);font-family:var(--font);color:var(--navy);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button,a{transition:transform .12s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease,border-color .15s;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled),a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* marco: celular a pantalla completa, teléfono centrado en compu */
#root{height:100%;display:flex;justify-content:center;align-items:center}
.stage{height:100%;width:100%;display:flex;justify-content:center;align-items:center;
  background-color:var(--navy);background-image:radial-gradient(rgba(214,111,169,.35) 1px,transparent 1.5px);background-size:14px 14px}
.app{position:relative;width:100%;max-width:440px;height:100%;background:var(--papel);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:640px){
  .app{height:min(880px,calc(100% - 40px));width:400px;border:10px solid #11142b;border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}

/* texturas del sistema */
.halftone{background-color:var(--rosa);background-image:radial-gradient(rgba(31,36,73,.45) 1px,transparent 1.5px);background-size:4px 4px}
.grid-rosa{background-image:linear-gradient(rgba(214,111,169,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(214,111,169,.22) 1px,transparent 1px);background-size:14px 14px}
.grid-navy{background-image:linear-gradient(rgba(31,36,73,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(31,36,73,.14) 1px,transparent 1px);background-size:14px 14px}
.asterisco{display:inline-block}

/* estructura de pantalla */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:20px 22px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.eyebrow{font-size:9px;letter-spacing:.06em;font-weight:500;display:flex;justify-content:space-between}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.muted{font-size:12px;line-height:1.45}
h1{text-wrap:balance}

/* cabeceras */
.hdr{position:relative;background:var(--navy);color:var(--rosa);padding:16px 22px 18px;overflow:hidden;flex-shrink:0}
.hdr h1{position:relative;margin:16px 0 0;font-size:30px;font-weight:800;line-height:.98}
.hdr p{position:relative;margin:6px 0 0;font-size:12px;color:#fff}
.hdr > *{position:relative}
.hdr .deco{position:absolute}

/* botones */
.btn{min-height:48px;padding:0 18px;border:none;border-radius:0;font-size:13px;font-weight:800;letter-spacing:.07em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase}
.btn-navy{background:var(--navy);color:var(--rosa)}
.btn-navy:hover{box-shadow:5px 5px 0 var(--rosa)}
.btn-rosa{background:var(--rosa);color:var(--navy)}
.btn-rosa:hover{box-shadow:5px 5px 0 var(--amarillo)}
.btn-ghost{background:transparent;color:var(--navy);border:1px dashed var(--navy)}
.btn-ghost:hover{background:var(--gris)}
.btn-ghost.on-dark{color:var(--rosa);border-color:var(--rosa)}
.btn-ghost.on-dark:hover{background:rgba(214,111,169,.12)}
.btn-link{background:transparent;border:none;padding:0 6px;min-height:36px;color:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;text-decoration:underline;text-transform:uppercase}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px dashed currentColor;color:inherit;flex-shrink:0;padding:0}
.icon-btn.plain{border:none}
.icon-btn.on{background:var(--amarillo);border:1px solid var(--navy);color:var(--navy)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 22px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex-shrink:0;min-height:38px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;background:var(--papel);color:var(--navy);border:1px dashed var(--navy);font-size:12px;font-weight:600;letter-spacing:.03em}
.chip:hover{background:var(--gris)}
.chip.on{background:var(--navy);color:var(--rosa);border:1px solid var(--navy);font-weight:800}
.chip.big{min-height:44px;font-size:13px}
.filterbar{position:sticky;top:0;z-index:3;background:var(--papel);border-bottom:1px dashed var(--navy);padding:12px 0 10px;display:flex;flex-direction:column;gap:8px}
.filterrow{display:flex;align-items:center;gap:8px}
.filterrow .label{flex-shrink:0;width:64px;padding-left:22px;box-sizing:content-box;font-size:10px}
.filterrow .chips{padding-left:0}
.tag{display:inline-block;background:var(--navy);color:var(--rosa);font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.input{height:48px;width:100%;padding:0 12px;border:1px solid var(--navy);border-radius:0;background:var(--papel);color:var(--navy);font-size:16px}
.input:focus{outline:3px solid var(--rosa);outline-offset:1px}
.input.err{border:2px solid var(--error);background:var(--errorbg)}
.input.dark{background:transparent;color:#fff;border:1px dashed var(--rosa)}
.input.dark::placeholder{color:rgba(255,255,255,.65)}
.pass{position:relative}
.pass .input{padding-right:52px}
.pass .icon-btn{position:absolute;right:2px;top:2px;border:none;color:var(--navy)}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:12px;font-weight:600;line-height:1.35}
.msg.err{color:var(--error)}
.msg.ok{color:var(--ok)}
.hint{font-size:11px;line-height:1.35}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:13px;line-height:1.45}
.alert.err{background:var(--errorbg);border:2px solid var(--error);color:var(--error)}
.alert.info{background:var(--amarillo);color:var(--navy)}

/* barra de pestañas */
.tabbar{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--navy);border-top:1px dashed var(--rosa);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:transparent;border:none;border-top:3px solid transparent;color:#fff;font-size:10px;font-weight:600;letter-spacing:.08em}
.tab.on{color:var(--rosa);font-weight:800;border-top-color:var(--rosa)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-26px;background:var(--amarillo);color:var(--navy);font-size:9px;font-weight:900;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center}
.tab{position:relative}

/* tarjetas */
.card{display:flex;flex-direction:column;border:1px solid var(--navy);background:var(--papel);color:var(--navy);text-align:left;padding:0;width:100%}
button.card:hover{box-shadow:6px 6px 0 var(--rosa)}
.duo{position:relative;overflow:hidden;isolation:isolate}
.duo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2);mix-blend-mode:multiply}
.duo::after{content:"";position:absolute;inset:0;background:var(--navy);mix-blend-mode:lighten;pointer-events:none}
.duo > .over{position:relative;z-index:1}
.dashed-top{border-top:1px dashed var(--navy)}
.dashed-bottom{border-bottom:1px dashed var(--navy)}

/* feed */
.post-tile{position:relative;height:196px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px dashed var(--navy);border-bottom:1px dashed var(--navy)}
.post-tile .mark{position:relative;font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.02em}
.post-tile .cap{position:absolute;left:12px;bottom:10px;font-size:10px;font-weight:600;letter-spacing:.06em}
.matlink{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 12px;border:1px dashed var(--navy);background:var(--papel);color:var(--navy);text-align:left;width:100%}
.matlink:hover{background:var(--errorbg);border-style:solid}
.act{height:44px;padding:0 10px;background:transparent;border:none;display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-size:12px;font-weight:600}
.act:hover{background:var(--gris)}
.act.liked{color:#b0306f;font-weight:800}
.act.saved{font-weight:800}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--rosa)}
.avatar-ini{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);border:2px solid var(--rosa)}

/* detalle facultad */
.tabs4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 14px;border-bottom:1px solid var(--navy);background:var(--papel);position:sticky;top:0;z-index:3}
.tabs4 button{min-height:50px;background:transparent;border:none;border-bottom:4px solid transparent;color:var(--navy);font-size:11px;font-weight:500;letter-spacing:.06em;padding:0}
.tabs4 button.on{font-weight:800;border-bottom-color:var(--rosa)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px dashed var(--navy)}
.kv3 > div{padding:10px;display:flex;flex-direction:column;gap:2px}
.kv3 > div + div{border-left:1px dashed var(--navy)}
.vert{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:14px;letter-spacing:.08em}
.mat{font-size:11px;line-height:1.25;padding:5px 8px;background:var(--gris);font-weight:600}
.mat.main{background:var(--rosa);font-weight:800}
.mat.extra{background:transparent;border:1px dashed var(--navy);font-style:italic;font-weight:500}

/* capas */
.toast{position:absolute;left:14px;right:14px;z-index:40;background:var(--navy);color:#fff;border:1px dashed var(--rosa);padding:10px 8px 10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(31,36,73,.3);animation:up .25s ease}
.toast.err{background:var(--amarillo);color:var(--navy);border:2px solid var(--navy)}
.toast .undo{min-height:36px;padding:0 8px;background:transparent;border:none;color:var(--amarillo);font-size:12px;font-weight:800;letter-spacing:.06em;text-decoration:underline}
.toast.err .undo{color:var(--navy)}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.veil{position:absolute;inset:0;z-index:50;background:rgba(31,36,73,.72);display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;background:var(--papel);border-top:4px solid var(--rosa);padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s ease;max-height:92%;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.savebar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--papel);border-top:2px solid var(--navy);padding:10px 14px;display:flex;align-items:center;gap:10px;animation:up .2s ease}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border:1px dashed var(--rosa)}
.steps span.done{background:var(--rosa);border-style:solid}
.progress{height:8px;border:1px dashed var(--rosa)}
.progress > div{height:100%;background:var(--rosa);transition:width .3s ease}
.empty{border:1px dashed var(--navy);padding:24px 20px;text-align:center;font-size:13px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--navy)}
.seg button{min-height:44px;background:var(--papel);border:none;color:var(--navy);font-size:11px;font-weight:600;letter-spacing:.03em;padding:0 2px}
.seg button + button{border-left:1px dashed var(--navy)}
.seg button.on{background:var(--navy);color:var(--rosa);font-weight:800}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--navy);background:var(--papel);color:var(--navy);text-align:left;width:100%}
.list-item:hover{box-shadow:5px 5px 0 var(--rosa)}
.menu-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 4px;background:transparent;border:none;border-bottom:1px dashed var(--navy);color:var(--navy);font-size:14px;font-weight:700;width:100%;text-align:left}
.menu-item:hover{background:var(--gris)}
.fab{position:absolute;right:16px;bottom:16px;z-index:20;min-height:52px;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;background:var(--rosa);color:var(--navy);border:2px solid var(--navy);font-size:12px;font-weight:900;letter-spacing:.07em;box-shadow:4px 4px 0 var(--navy)}
.fab:hover{background:var(--amarillo)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;background:var(--papel);color:var(--navy);border:1px dashed var(--navy);text-align:left}
.opt:hover{background:var(--gris)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.on{border:2px solid var(--navy);background:var(--errorbg)}
.opt.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rosa)}
.opt.err{border-color:var(--error)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;height:250px}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:0 0 100%;height:100%;scroll-snap-align:start;border:none;padding:0;background:#11142b}
.carousel .slide:active{transform:none}
.carousel img{width:100%;height:100%;object-fit:cover;display:block}
.post-tile .count{position:absolute;right:10px;bottom:10px;background:var(--navy);color:var(--rosa);font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 8px;pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs.err{outline:2px solid var(--error);outline-offset:4px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden;background:var(--gris);border:1px solid var(--navy)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.thumb .portada,.thumb .mkcover{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:800;letter-spacing:.05em;padding:3px 5px}
.thumb .portada{background:var(--rosa);color:var(--navy)}
.thumb .mkcover{background:rgba(255,255,255,.92);color:var(--navy);border:1px dashed var(--navy);min-height:24px}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--navy);background:var(--papel);cursor:pointer;font-size:11px;font-weight:700;text-align:center;transition:background-color .15s}
.thumb.add:hover{background:var(--errorbg)}
.thumb.add:focus-within{outline:3px solid var(--amarillo);outline-offset:2px}
.thumb.loading{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.input.area{height:auto;min-height:110px;padding:10px 12px;line-height:1.45;resize:vertical;font-size:15px}
.mini{display:flex;flex-direction:column;border:1px solid var(--navy);background:var(--papel);color:var(--navy);padding:0;text-align:left;overflow:hidden}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.mini:hover{box-shadow:5px 5px 0 var(--rosa)}
.mat.link{border:none;color:var(--navy);text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;text-align:left;font-family:inherit}
.mat.link:hover{outline:1px solid var(--navy)}
.mat.link .hora{display:inline-flex}
.cat-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--papel);color:var(--navy);border:1px dashed var(--navy);text-align:left}
.cat-row:hover{background:var(--gris)}
.cat-row .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cat-row.on{border:2px solid var(--navy);background:var(--errorbg)}
.cat-row.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--rosa)}
.slot{font-size:11px;font-weight:700;padding:3px 7px;border:1px solid var(--navy)}
.slot.tM{background:var(--amarillo)}
.slot.tT{background:var(--rosa)}
.slot.tN{background:var(--navy);color:var(--papel)}
.slot.tX{background:var(--gris);font-style:italic}
.seg.dark{border-color:var(--rosa);grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.dark button{background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px}
.seg.dark button + button{border-left:1px dashed var(--rosa)}
.seg.dark button.on{background:var(--rosa);color:var(--navy)}
.car-chip{background:transparent;color:#fff;border-color:var(--rosa)}
.car-chip:hover{background:rgba(214,111,169,.15)}
.car-chip.on{background:var(--rosa);color:var(--navy);border:1px solid var(--rosa)}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1px solid var(--navy)}
.tdot.tM{background:var(--amarillo)}.tdot.tT{background:var(--rosa)}.tdot.tN{background:var(--navy);border-color:#fff}.tdot.tX{background:var(--gris)}
.cat-chip .tdot.tN{border-color:var(--navy)}
.year{padding:0 22px;border-top:1px dashed var(--navy)}
.year:last-of-type{border-bottom:1px dashed var(--navy)}
.year.open{background:#faf9fc;padding-bottom:18px}
.year-head{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 0;background:transparent;border:none;color:var(--navy)}
.year-head:active{transform:none}
.year-head:hover{background:rgba(31,36,73,.03)}
.year .chev{transition:transform .2s ease;display:flex}
.year.open .chev{transform:rotate(180deg)}
.year-num{font-size:52px;font-weight:900;line-height:.8;color:var(--rosa);min-width:34px;-webkit-text-stroke:1px var(--navy)}
.mat-card{border:1px solid var(--navy);background:var(--papel)}
.mat-card.libre{border-style:dashed;background:var(--gris)}
.mat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 12px 10px;background:transparent;border:none;color:var(--navy);text-align:left}
button.mat-head:hover{background:var(--gris)}
button.mat-head:active{transform:none}
.mat-name{font-size:14px;font-weight:800;line-height:1.2}
.mat-meta{font-size:11px;font-weight:600}

function programaPara(nombre) {
  var n = norm(nombre), avanzado = /\b(ii|iii|iv|2|3|4)\b/.test(n);
  if (/electiva|optativ|seminario/.test(n)) return 'electiva';
  if (/morfologia/.test(n)) return 'morfo';
  if (/tipografia/.test(n)) return 'tipo';
  if (/comunicacion i|comunicacion$|comunicacion ii/.test(n) && !/visual/.test(n)) return 'comu';
  if (/historia/.test(n)) return 'hist';
  if (/tecnologia/.test(n)) return 'tec';
  if (/medios expresivos/.test(n) && !/indumentaria|textil/.test(n)) return 'medios';
  if (/legislacion|practica profesional/.test(n)) return 'legis';
  if (/ceramica/.test(n)) return 'cer';
  if (/textil/.test(n)) return 'tex';
  if (/indumentaria/.test(n)) return 'ind';
  if (/audiovisual/.test(n)) return 'dis';
  if (/arquitectura|proyecto i\b|proyecto$|analisis proyectual|taller de proyecto/.test(n)) return avanzado ? 'arq2' : 'arq1';
  if (/industrial|\bdi\b/.test(n)) return avanzado ? 'di2' : 'di1';
  return avanzado ? 'dg2' : 'dg1';
}
function anioEnPlan(fac, nombre, car) {
  var f = facById(fac), res = null;
  f.carreras.filter(function (c) { return !car || c.sigla === car; }).forEach(function (c) { (c.plan || []).forEach(function (y) { if (!res && y[2].some(function (m) { return m.replace(/^[*+]/, '').replace('¹', '') === nombre; })) res = y[0] + (y[1] && !/hs/.test(y[1]) ? ' · ' + y[1].replace(' · ¹ o en 4°', '') : ''); }); });
  return res;
}
function materiaKey(fac, nombre) { return fac + '|' + nombre; }
function getMateria(fac, nombre, catedra, car) {
  var f = facById(fac), pg = PROGRAMAS[programaPara(nombre)];
  return {
    key: materiaKey(fac, nombre), fac: fac, facSigla: f.sigla, nombre: nombre, catedra: catedra || 'Cátedra 1',
    carrera: (car && carreraDe(fac, car) ? carreraDe(fac, car).nombre : null) || (f.carreras.filter(function (x) { return (x.plan || []).some(function (y) { return y[2].some(function (m) { return m.replace(/^[*+]/, '').replace('¹', '') === nombre; }); }); })[0] || {}).nombre || pg.carrera,
    horarios: horariosDe(fac, nombre, car), anio: anioEnPlan(fac, nombre, car) || anioEnPlan(fac, nombre) || (/\b(ii|2)\b/.test(norm(nombre)) ? 'Segundo nivel' : /\b(iii|3)\b/.test(norm(nombre)) ? 'Tercer nivel' : 'Primer nivel'),
    regimen: (horariosDe(fac, nombre, car) || {}).regimen || 'Anual', desc: pg.desc, tps: pg.tps, herramientas: pg.herramientas
  };
}

var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function emailError(v) {

/* ---------------- REGISTRO (3 pasos) ---------------- */
function REG_VACIO() { return { nombre: '', apellido: '', email: '', pass: '', prov: '', nivel: '', anio: '5° año', facu: '', carrera: '', anioCar: '1° año', edad: '', intereses: [] }; }
function regErrors(d, users) {
  var e = {};
  if (!d.nombre.trim()) e.nombre = 'Escribí tu nombre';
  var ee = emailError(d.email); if (ee) e.email = ee;
  else if (users[d.email.trim().toLowerCase()]) e.email = 'Ya hay una cuenta con este email';
  if (d.pass.length < 6) e.pass = d.pass ? 'Tiene que tener al menos 6 caracteres (te faltan ' + (6 - d.pass.length) + ')' : 'Elegí una contraseña de al menos 6 caracteres';
  if (!d.prov) e.prov = 'Elegí tu provincia para mostrarte facultades cerca';
  if (!d.nivel) e.nivel = 'Contanos en qué etapa estás';
  if (d.nivel === 'facultad' && !d.facu) e.facu = 'Elegí tu facultad';
  if (d.nivel === 'facultad' && !d.carrera) e.carrera = 'Elegí tu carrera';
  var n = parseInt(d.edad, 10);
  if (d.edad !== '' && (isNaN(n) || n < 12 || n > 99)) e.edad = 'Tiene que ser un número entre 12 y 99';
  if (!d.intereses.length) e.intereses = 'Elegí al menos una';
  return e;
}
var STEP_FIELDS = { 1: ['nombre', 'email', 'pass'], 2: ['nivel', 'prov', 'facu', 'carrera', 'edad'], 3: ['intereses'] };

  function set(k, v) { var nd = Object.assign({}, d); nd[k] = v; c.sub('reg', { d: nd }); }
  function touch(k) { var t = Object.assign({}, R.touched); t[k] = true; c.sub('reg', { touched: t }); }
  var stepOk = STEP_FIELDS[R.step].every(function (k) { return !errs[k]; });
  function next() {
    if (!stepOk) { var tr = Object.assign({}, R.tried); tr[R.step] = true; c.sub('reg', { tried: tr }); c.notify('Revisá los campos marcados para seguir', null, true); return; }
    if (R.step < 3) { c.sub('reg', { step: R.step + 1 }); return; }
    var em = d.email.trim().toLowerCase();
    var u = { nombre: d.nombre.trim(), apellido: d.apellido.trim(), email: em, pass: d.pass, prov: d.prov, nivel: d.nivel, anio: d.nivel === 'secundaria' ? d.anio : '', facu: d.nivel === 'facultad' ? d.facu : '', carrera: d.nivel === 'facultad' ? d.carrera : '', anioCar: d.nivel === 'facultad' ? d.anioCar : '', edad: d.edad, intereses: d.intereses.slice(), avatar: null, saved: { posts: [], facs: [], materias: [], becas: [] }, likes: [] };
    c.up(function (p) { var users = Object.assign({}, p.users); users[em] = u; return { users: users, reg: { step: 1, d: REG_VACIO(), touched: {}, tried: {}, show: false } }; });
    c.login(em);
    c.notify('¡Listo, ' + u.nombre + '! Tu perfil está creado');
  }
  function prev() { if (R.step === 1) c.up({ screen: 'login' }); else c.sub('reg', { step: R.step - 1 }); }
  var titles = { 1: ['Creá tu cuenta', 'Con esto vas a poder guardar facultades, materias y trabajos.'], 2: ['¿Dónde estás?', 'Contanos si estás terminando la secundaria o si ya estudiás en una facultad.'], 3: ['¿Qué te interesa?', 'Elegí todas las que quieras. Lo podés cambiar después.'] };
  var emailExiste = errs.email === 'Ya hay una cuenta con este email' && show('email');

  return html`<div className="screen">
    <div className="hdr" style=${{ paddingBottom: 20 }}>
      <div className="row" style=${{ justifyContent: 'space-between' }}>
        <button type="button" className="icon-btn plain" style=${{ color: '#d66fa9', marginLeft: -10 }} aria-label=${R.step === 1 ? 'Volver a iniciar sesión' : 'Volver al paso anterior'} onClick=${prev}>${I('back', 22)}</button>
        <span className="label" aria-live="polite">Paso ${R.step} de 3</span>
      </div>
      <div className="steps" aria-hidden="true" style=${{ marginTop: 10 }}>${[1, 2, 3].map(function (i) { return html`<span key=${i} className=${i <= R.step ? 'done' : ''}></span>`; })}</div>
      <h1>${titles[R.step][0].toUpperCase()}</h1>
      <p>${titles[R.step][1]}</p>
    </div>
    <div className="scroll">
      <form noValidate className="pad stack" style=${{ gap: 16 }} onSubmit=${function (e) { e.preventDefault(); next(); }}>
        ${R.step === 1 ? html`
          <div className="grid2">
            <div className="field"><label htmlFor="r-nombre">Nombre *</label>
              <input id="r-nombre" className=${'input' + (show('nombre') ? ' err' : '')} autoComplete="given-name" value=${d.nombre} aria-invalid=${!!show('nombre')} onChange=${function (e) { set('nombre', e.target.value); }} onBlur=${function () { touch('nombre'); }} />
              ${Msg(show('nombre'))}</div>
            <div className="field"><label htmlFor="r-apellido">Apellido</label>
              <input id="r-apellido" className="input" autoComplete="family-name" value=${d.apellido} onChange=${function (e) { set('apellido', e.target.value); }} /></div>
          </div>
          <div className="field"><label htmlFor="r-email">Email *</label>
            <input id="r-email" className=${'input' + (show('email') ? ' err' : '')} type="email" inputMode="email" autoComplete="email" placeholder="nombre@mail.com" value=${d.email} aria-invalid=${!!show('email')} onChange=${function (e) { set('email', e.target.value); }} onBlur=${function () { touch('email'); }} />
            ${Msg(show('email'))}
            ${emailExiste ? html`<button type="button" className="btn-link" style=${{ alignSelf: 'flex-start', paddingLeft: 0 }} onClick=${function () { c.up(function (p) { return { screen: 'login', login: Object.assign({}, p.login, { email: d.email, error: null }) }; }); }}>Ingresar con ese email</button>` : null}
            ${!errs.email && R.touched.email ? Msg('Email válido', 'ok') : null}</div>
          <div className="field"><label htmlFor="r-pass">Contraseña *</label>
            <div className="pass">
              <input id="r-pass" className=${'input' + (show('pass') ? ' err' : '')} type=${R.show ? 'text' : 'password'} autoComplete="new-password" value=${d.pass} aria-describedby="r-pass-hint" onChange=${function (e) { set('pass', e.target.value); }} onBlur=${function () { touch('pass'); }} />
              <button type="button" className="icon-btn" aria-label=${R.show ? 'Ocultar contraseña' : 'Mostrar contraseña'} aria-pressed=${R.show} onClick=${function () { c.sub('reg', { show: !R.show }); }}>${I(R.show ? 'eyeoff' : 'eye', 20, { sw: 1.8 })}</button>
            </div>
            ${show('pass') ? Msg(show('pass')) : html`<span id="r-pass-hint" className=${'hint' + (d.pass.length >= 6 ? ' msg ok' : '')}>${d.pass.length >= 6 ? html`${I('check', 13, { sw: 3 })} Contraseña segura` : 'Mínimo 6 caracteres.'}</span>`}</div>
        ` : null}

        ${R.step === 2 ? html`
          <div className="field" role="radiogroup" aria-labelledby="r-nivel-l">
            <span id="r-nivel-l" className="label">¿En qué etapa estás? *</span>
            ${[['secundaria', 'Estoy en la secundaria', 'Quiero conocer carreras y facultades'], ['facultad', 'Ya estudio en una facultad', 'Quiero compartir mis trabajos y ver otras cursadas']].map(function (o) {
              var on = d.nivel === o[0];
              return html`<button key=${o[0]} type="button" role="radio" aria-checked=${on} className=${'opt' + (on ? ' on' : '') + (show('nivel') ? ' err' : '')} onClick=${function () { set('nivel', o[0]); touch('nivel'); }}>
                <span className="dot" aria-hidden="true"></span>
                <span className="stack" style=${{ gap: 2 }}><span style=${{ fontSize: 14, fontWeight: 800 }}>${o[1]}</span><span style=${{ fontSize: 12 }}>${o[2]}</span></span>
              </button>`;
            })}
            ${Msg(show('nivel'))}
          </div>
          <div className="field" style=${{ background: '#fbce00', padding: 16, gap: 10 }}>
            <label htmlFor="r-prov">¿De qué provincia sos? *</label>
            <select id="r-prov" className=${'input' + (show('prov') ? ' err' : '')} style=${{ fontWeight: 600 }} value=${d.prov} onChange=${function (e) { set('prov', e.target.value); touch('prov'); }}>
              <option value="" disabled>Elegí una provincia</option>
              ${PROVS.map(function (p) { return html`<option key=${p.id} value=${p.id}>${p.nombre}</option>`; })}
            </select>
            ${Msg(show('prov'))}
            ${d.prov ? html`<span className="muted fade-in">Encontramos <strong>${provById(d.prov).facs.length} ${provById(d.prov).facs.length === 1 ? 'facultad pública' : 'facultades públicas'}</strong> con diseño cerca tuyo.</span>` : null}
          </div>
          ${d.nivel === 'facultad' ? html`<div className="stack fade-in" style=${{ gap: 14 }}>
            <div className="field"><label htmlFor="r-facu">¿En qué facultad? *</label>
              <select id="r-facu" className=${'input' + (show('facu') ? ' err' : '')} value=${d.facu} onChange=${function (e) { var nd = Object.assign({}, d, { facu: e.target.value, carrera: '' }); c.sub('reg', { d: nd }); touch('facu'); }}>
                <option value="" disabled>Elegí tu facultad</option>
                ${FACS.map(function (f) { return html`<option key=${f.id} value=${f.id}>${f.sigla} · ${f.uni}</option>`; })}
              </select>${Msg(show('facu'))}</div>
            <div className="grid2">
              <div className="field"><label htmlFor="r-car">Carrera *</label>
                <select id="r-car" className=${'input' + (show('carrera') ? ' err' : '')} disabled=${!d.facu} value=${d.carrera} onChange=${function (e) { set('carrera', e.target.value); touch('carrera'); }}>
                  <option value="" disabled>${d.facu ? 'Elegí' : 'Primero la facultad'}</option>
                  ${(d.facu ? facById(d.facu).carreras : []).map(function (x) { return html`<option key=${x.sigla} value=${x.sigla}>${x.nombre}</option>`; })}
                </select>${Msg(show('carrera'))}</div>
              <div className="field"><label htmlFor="r-aniocar">Año de la carrera</label>
                <select id="r-aniocar" className="input" value=${d.anioCar} onChange=${function (e) { set('anioCar', e.target.value); }}>
                  ${ANIOS_CAR.map(function (a) { return html`<option key=${a} value=${a}>${a}</option>`; })}
                </select></div>
            </div>
          </div>` : null}
          <div className="grid2">
            ${d.nivel === 'secundaria' ? html`<div className="field fade-in"><label htmlFor="r-anio">Año que cursás</label>
              <select id="r-anio" className="input" value=${d.anio} onChange=${function (e) { set('anio', e.target.value); }}>

              <input id="r-edad" className=${'input' + (show('edad') ? ' err' : '')} type="number" inputMode="numeric" min="12" max="99" value=${d.edad} onChange=${function (e) { set('edad', e.target.value); }} onBlur=${function () { touch('edad'); }} />
              ${Msg(show('edad'))}</div>
          </div>
        ` : null}

        ${R.step === 3 ? html`
          <div className="row" style=${{ justifyContent: 'space-between' }}>
            <span className="label">Elegí una o más</span>
            <span className="label" aria-live="polite">${d.intereses.length ? d.intereses.length + (d.intereses.length === 1 ? ' elegida' : ' elegidas') : 'Ninguna'}</span>
          </div>
          <div className="chips wrap">
            ${INTERESES.map(function (it) {
              var on = d.intereses.indexOf(it[0]) >= 0;
              return html`<button key=${it[0]} type="button" className=${'chip big' + (on ? ' on' : '')} aria-pressed=${on} onClick=${function () {

              }}>${on ? I('check', 13, { sw: 3.2 }) : null}${it[1]}</button>`;
            })}

        ` : null}

        <div className="row" style=${{ gap: 10, marginTop: 8 }}>
          <button type="button" className="btn btn-ghost" onClick=${prev}>${R.step === 1 ? 'Cancelar' : 'Atrás'}</button>
          <button type="submit" className="btn btn-navy" style=${{ flex: 1 }}>${R.step === 3 ? 'Crear mi perfil' : 'Siguiente'} ${I('arrow', 16, { sw: 2.4 })}</button>

      </form>
    </div>
  </div>`;
}

/* ---------------- INICIO ---------------- */
function InicioScreen(c) {
  var S = c.S, F = S.feed, u = c.user;
  var q = norm(F.q.trim());
  var posts = c.allPosts.filter(function (p) {
    var okQ = !q || norm([p.titulo, p.desc, p.autor, p.materia, p.carrera, facById(p.fac).sigla].join(' ')).indexOf(q) >= 0;
    return (F.fac === 'todas' || p.fac === F.fac) && (F.car === 'todas' || p.ck === F.car) && okQ;
  });
  var mapInt = { DG: 'dg', ARQ: 'arq', DI: 'di' };
  var prefs = (u.intereses || []).map(function (k) { return mapInt[k]; }).filter(Boolean);
  if (F.car === 'todas' && prefs.length) posts = posts.slice().sort(function (a, b) { return (prefs.indexOf(b.ck) >= 0) - (prefs.indexOf(a.ck) >= 0); });
  var facN = F.fac === 'todas' ? '' : (facById(F.fac) || {}).sigla;
  var facsConPosts = FACS.filter(function (f) { return c.allPosts.some(function (p) { return p.fac === f.id; }); });
  var carN = { todas: '', dg: 'Gráfico', arq: 'Arquitectura', di: 'Industrial', ux: 'UX/UI', otras: 'Otras carreras' }[F.car];
  var partes = [facN, carN, q ? '"' + F.q.trim() + '"' : ''].filter(Boolean);
  var grupos = [{ key: 'fac', label: 'Facultad', def: 'todas', opts: [['todas', 'Todas']].concat(facsConPosts.map(function (f) { return [f.id, f.sigla]; })) },
    { key: 'car', label: 'Carrera', def: 'todas', opts: [['todas', 'Todas'], ['dg', 'Gráfico'], ['arq', 'Arquitectura'], ['di', 'Industrial'], ['ux', 'UX/UI'], ['otras', 'Otras']] }];
  function limpiar() { var antes = Object.assign({}, F); c.sub('feed', { fac: 'todas', car: 'todas', q: '', buscando: false }); c.notify('Filtros borrados', function () { c.sub('feed', antes); }); }
  function chip(key, val, label) {
    var on = F[key] === val;
    return html`<button key=${val} type="button" className=${'chip' + (on ? ' on' : '')} aria-pressed=${on} onClick=${function () { var o = {}; o[key] = val; c.sub('feed', o); }}>${on && val !== 'todas' ? I('check', 12, { sw: 3.2 }) : null}${label}</button>`;
  }
  return html`<div className="screen"><div className="scroll">
    <div className="hdr">
      <div className="halftone deco" aria-hidden="true" style=${{ top: -20, right: 70, width: 80, height: 80, borderRadius: '50%', opacity: .55 }}></div>
      <div className="row" style=${{ justifyContent: 'space-between' }}>
        <div className="row" style=${{ gap: 8 }}>${Asterisco(20, '#d66fa9', 3)}<span style=${{ fontSize: 12, fontWeight: 800, letterSpacing: '.04em', lineHeight: 1.05 }}>DISEÑA LO<br />QUE VIENE</span></div>
        <button type="button" className=${'icon-btn' + (F.buscando ? ' on' : '')} style=${F.buscando ? { background: '#d66fa9', borderColor: '#d66fa9', color: '#1f2449' } : null} aria-expanded=${F.buscando} aria-label=${F.buscando ? 'Cerrar búsqueda' : 'Buscar trabajos'}
          onClick=${function () { c.sub('feed', { buscando: !F.buscando, q: F.buscando ? '' : F.q }); }}>${I(F.buscando ? 'x' : 'search', F.buscando ? 16 : 18, { sw: 2.4 })}</button>
      </div>
      ${F.buscando ? html`<div className="field fade-in" style=${{ marginTop: 14 }}>
          <label htmlFor="h-q" style=${{ color: '#fff' }}>Buscar trabajos</label>
          <input id="h-q" className="input dark" autoFocus placeholder="Ej: afiche, silla, tipografía, Martina" value=${F.q} onChange=${function (e) { c.sub('feed', { q: e.target.value }); }} />
        </div>` : html`<div>
          <h1 style=${{ fontSize: 24, marginTop: 12 }}>HOLA, ${u.nombre.toUpperCase()}</h1>
          <p>${u.nivel === 'facultad' ? 'Mirá qué se cursa en otras facultades y compartí lo que hacés vos.' : 'Esto se está proyectando hoy en facultades públicas.'}</p>
        </div>`}
    </div>

    ${FiltroBar(c, 'feed', grupos)}

    <div className="pad stack" style=${{ gap: 16, paddingTop: 12 }}>
      ${S.tip ? html`<div className="alert info fade-in" role="note" style=${{ flexDirection: 'column', gap: 8 }}>
        <div className="row" style=${{ gap: 10, alignItems: 'flex-start' }}>${I('bulb', 20)}<span><strong>Tip:</strong> tocá la materia de cada trabajo para ver qué se hace en esa cursada. Guardá lo que te guste con el marcador y lo encontrás en tu Perfil.</span></div>
        <button type="button" className="btn btn-navy" style=${{ alignSelf: 'flex-end', minHeight: 36, fontSize: 11, color: '#fbce00' }} onClick=${function () { c.up({ tip: false }); }}>Entendido</button>
      </div>` : null}
      <div className="row" style=${{ justifyContent: 'space-between', gap: 10, minHeight: 36 }}>
        <span className="label" aria-live="polite" style=${{ lineHeight: 1.35 }}>${posts.length} ${posts.length === 1 ? 'trabajo' : 'trabajos'} · ${partes.length ? partes.join(' · ') : (prefs.length ? 'Primero lo que te interesa' : 'Todas las facultades')}</span>
        ${partes.length ? html`<button type="button" className="btn-link" onClick=${limpiar}>Limpiar filtros</button>` : null}
      </div>
      ${posts.length === 0 ? html`<div className="empty">${Asterisco(34, '#d66fa9', 2.4)}<span><strong>Todavía no hay trabajos acá</strong><br />${F.car === 'ux' && !q ? 'Todavía no hay trabajos de UX/UI cargados. Mientras tanto, mirá Gráfico.' : 'No hay resultados con estos filtros. Probá sacando alguno.'}</span>
        <button type="button" className="btn btn-navy" onClick=${limpiar}>Ver todos los trabajos</button></div>` : null}
      ${posts.map(function (p) { return PostCard(c, p); })}
    </div>
  </div>
  <button type="button" className="fab" onClick=${function () { c.openSubir(); }} aria-label="Subir un trabajo">${I('plus', 20, { sw: 2.8 })}<span>SUBIR TRABAJO</span></button>
  ${FiltroSheet(c, 'feed', grupos, posts.length, ['trabajo', 'trabajos'])}
  </div>`;
}
function PostCard(c, p) {

  return html`<article key=${p.id} className="card" aria-label=${p.titulo + ', de ' + p.autor}>

            onClick=${function () { c.up({ zoom: { tiles: p.fotos.map(function (x, j) { return { img: x, titulo: p.titulo, tp: 'Foto ' + (j + 1) + ' de ' + n }; }), i: i } }); }}><img src=${src} alt=${'Foto ' + (i + 1) + ' de ' + p.titulo} /></button>`; })}
        </div>
        ${n > 1 ? html`<span className="count">${n} FOTOS · DESLIZÁ →</span>` : null}

var MAX_FOTOS = 6, MAX_TIT = 80, MAX_DESC = 280;
function achicarFoto(file, cb) {
  if (!/^image\//.test(file.type)) { cb('tipo'); return; }
  if (file.size > 20 * 1024 * 1024) { cb('peso'); return; }
  var r = new FileReader();
  r.onerror = function () { cb('leer'); };
  r.onload = function () {
    var img = new Image();
    img.onerror = function () { cb('leer'); };
    img.onload = function () {
      var max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(null, cv.toDataURL('image/jpeg', 0.78));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function subirErrors(T) {
  var e = {};
  if (!T.fotos.length) e.fotos = 'Subí al menos una foto del trabajo';
  if (!T.titulo.trim()) e.titulo = 'Ponele un título a tu trabajo';
  else if (T.titulo.length > MAX_TIT) e.titulo = 'El título es muy largo: máximo ' + MAX_TIT + ' caracteres';
  if (T.desc.trim().length < 10) e.desc = T.desc.trim() ? 'Contá un poco más (mínimo 10 caracteres)' : 'Escribí una bajada: de qué se trata en una o dos oraciones';
  else if (T.desc.length > MAX_DESC) e.desc = 'La bajada es muy larga: máximo ' + MAX_DESC + ' caracteres';
  if (!T.fac) e.fac = 'Elegí la facultad';
  if (!T.car) e.car = 'Elegí la carrera';
  if (!T.mat) e.mat = 'Elegí la materia';
  if (!T.cat) e.cat = 'Elegí la cátedra';
  return e;
}
function SubirScreen(c) {
  var T = c.S.subir || { fotos: [], titulo: '', desc: '', fac: '', car: '', mat: '', cat: '', touched: {}, tried: false, cargando: 0 };
  var errs = subirErrors(T);
  function show(k) { return (T.touched[k] || T.tried) && errs[k] ? errs[k] : ''; }
  function set(patch, touchKey) {
    c.up(function (p) { var cur = p.subir || T; var t = Object.assign({}, cur.touched); if (touchKey) t[touchKey] = true; return { subir: Object.assign({}, cur, patch, { touched: t }) }; });
  }
  var hayDatos = T.fotos.length || T.titulo || T.desc;
  function cancelar() { if (hayDatos) c.up({ sheet: 'descartar' }); else { c.up({ subir: null }); c.back(); } }
  function onFotos(e) {
    var files = Array.prototype.slice.call(e.target.files || []); e.target.value = '';
    if (!files.length) return;
    var lugar = MAX_FOTOS - T.fotos.length;
    if (lugar <= 0) { c.notify('Ya tenés ' + MAX_FOTOS + ' fotos, que es el máximo. Quitá alguna para sumar otra.', null, true); return; }
    var sobran = files.length - lugar; files = files.slice(0, lugar);
    set({ cargando: files.length });
    var malos = 0;
    files.forEach(function (f) {
      achicarFoto(f, function (err, data) {
        c.up(function (p) {
          var cur = p.subir; if (!cur) return {};
          var fotos = err ? cur.fotos : cur.fotos.concat([data]);
          return { subir: Object.assign({}, cur, { fotos: fotos, cargando: Math.max(0, cur.cargando - 1), touched: Object.assign({}, cur.touched, { fotos: true }) }) };
        });
        if (err) { malos++; c.notify(err === 'tipo' ? f.name + ' no es una imagen. Usá JPG o PNG.' : err === 'peso' ? f.name + ' pesa más de 20 MB.' : 'No pudimos abrir ' + f.name + '. Probá con otra.', null, true); }
      });
    });
    if (sobran > 0) setTimeout(function () { c.notify('Agregamos ' + lugar + (lugar === 1 ? ' foto' : ' fotos') + '. El máximo es ' + MAX_FOTOS + '.', null, true); }, 400);
  }
  function quitarFoto(i) {
    var antes = T.fotos.slice(); var f = T.fotos.slice(); f.splice(i, 1); set({ fotos: f });
    c.notify('Quitaste una foto', function () { set({ fotos: antes }); });
  }
  function portada(i) { if (i === 0) return; var f = T.fotos.slice(); var x = f.splice(i, 1)[0]; f.unshift(x); set({ fotos: f }); c.notify('Esa foto ahora es la portada'); }
  function publicar() {
    if (Object.keys(errs).length || T.cargando) {
      set({ tried: true });
      c.notify(T.cargando ? 'Esperá a que terminen de cargar las fotos' : 'Faltan datos: revisá los campos marcados', null, true);
      return;
    }
    var u = c.user, x = carreraDe(T.fac, T.car);
    var post = { id: 'u' + Date.now(), autorEmail: c.S.email, autor: (u.nombre + ' ' + (u.apellido || '')).trim(), fac: T.fac, carrera: x.nombre, ck: x.k, sigla: x.sigla,
      titulo: T.titulo.trim(), desc: T.desc.trim(), materia: T.mat, catedra: T.cat, fotos: T.fotos.slice(), likes: 0, fecha: Date.now() };
    if (!c.addPost(post)) { c.notify('No hay más espacio en este navegador. Probá con menos fotos o eliminá algún trabajo tuyo.', null, true); return; }
    c.up({ subir: null, stack: [], tab: 'inicio', feed: { fac: 'todas', car: 'todas', q: '', buscando: false } });
    c.notify('¡Tu trabajo se publicó en Inicio!', function () { c.removePost(post.id); });
  }
  var fac = T.fac ? facById(T.fac) : null;
  var mats = T.fac && T.car ? materiasDe(T.fac, T.car) : [];
  var catOpts = T.fac && T.mat ? catedrasDe(T.fac, T.mat, T.car) : CATEDRAS;
  var listo = !Object.keys(errs).length && !T.cargando;
  return html`<div className="screen">
    <div className="hdr" style=${{ paddingBottom: 18 }}>
      <div className="halftone deco" aria-hidden="true" style=${{ top: -24, right: 40, width: 90, height: 90, borderRadius: '50%', opacity: .5 }}></div>
      <div className="row" style=${{ justifyContent: 'space-between' }}>
        <button type="button" className="icon-btn plain" style=${{ color: '#d66fa9', marginLeft: -10 }} aria-label="Cancelar y volver" onClick=${cancelar}>${I('x', 18, { sw: 2.6 })}</button>
        <span className="label">Nuevo trabajo</span>
      </div>
      <h1 style=${{ fontSize: 28 }}>SUBÍ TU TRABAJO</h1>
      <p>Mostrá qué se hace en tu cursada. Lo van a ver estudiantes que están eligiendo carrera.</p>
    </div>
    <div className="scroll">
      <form noValidate className="pad stack" style=${{ gap: 20 }} onSubmit=${function (e) { e.preventDefault(); publicar(); }}>

        <div className="field">
          <div className="row" style=${{ justifyContent: 'space-between' }}><span className="label" id="s-fotos-l">Fotos *</span><span className="hint" aria-live="polite">${T.fotos.length} de ${MAX_FOTOS}${T.cargando ? ' · cargando ' + T.cargando + '…' : ''}</span></div>
          <div className=${'thumbs' + (show('fotos') ? ' err' : '')}>
            ${T.fotos.map(function (src, i) { return html`<div key=${i} className="thumb">
              <img src=${src} alt=${'Foto ' + (i + 1)} />
              ${i === 0 ? html`<span className="portada">PORTADA</span>` : html`<button type="button" className="mkcover" onClick=${function () { portada(i); }}>Hacer portada</button>`}
              <button type="button" className="rm" aria-label=${'Quitar foto ' + (i + 1)} onClick=${function () { quitarFoto(i); }}>${I('x', 12, { sw: 3 })}</button>
            </div>`; })}
            ${T.cargando ? html`<div className="thumb loading" aria-hidden="true"><span>Cargando…</span></div>` : null}
            ${T.fotos.length < MAX_FOTOS ? html`<label className="thumb add" htmlFor="s-fotos">
              ${I('image', 26, { sw: 1.8 })}<span>${T.fotos.length ? 'Agregar más' : 'Elegir fotos'}</span>
              <input id="s-fotos" className="sr" type="file" accept="image/*" multiple aria-labelledby="s-fotos-l" onChange=${onFotos} />
            </label>` : null}
          </div>
          ${show('fotos') ? Msg(show('fotos')) : html`<span className="hint">Hasta ${MAX_FOTOS} fotos. La primera es la portada. Podés elegir varias a la vez.</span>`}
        </div>

        <div className="field">
          <div className="row" style=${{ justifyContent: 'space-between' }}><label htmlFor="s-tit">Título *</label><span className=${'hint' + (T.titulo.length > MAX_TIT ? ' msg err' : '')}>${T.titulo.length}/${MAX_TIT}</span></div>
          <input id="s-tit" className=${'input' + (show('titulo') ? ' err' : '')} placeholder="Ej: Afiche para un festival de cine" value=${T.titulo} aria-invalid=${!!show('titulo')}
            onChange=${function (e) { set({ titulo: e.target.value }); }} onBlur=${function () { set({}, 'titulo'); }} />
          ${Msg(show('titulo'))}
        </div>
        <div className="field">
          <div className="row" style=${{ justifyContent: 'space-between' }}><label htmlFor="s-desc">Bajada *</label><span className=${'hint' + (T.desc.length > MAX_DESC ? ' msg err' : '')}>${T.desc.length}/${MAX_DESC}</span></div>
          <textarea id="s-desc" className=${'input area' + (show('desc') ? ' err' : '')} rows="4" placeholder="De qué se trata, cuál era la consigna o qué te gustó resolver." value=${T.desc} aria-invalid=${!!show('desc')}
            onChange=${function (e) { set({ desc: e.target.value }); }} onBlur=${function () { set({}, 'desc'); }}></textarea>
          ${Msg(show('desc'))}
        </div>

        <div className="stack dashed-top" style=${{ gap: 14, paddingTop: 18 }}>
          <span className="label">¿De dónde es el trabajo?</span>
          <div className="field"><label htmlFor="s-fac">Facultad *</label>
            <select id="s-fac" className=${'input' + (show('fac') ? ' err' : '')} value=${T.fac} onChange=${function (e) { set({ fac: e.target.value, car: '', mat: '' }, 'fac'); }}>
              <option value="" disabled>Elegí la facultad</option>
              ${FACS.map(function (f) { return html`<option key=${f.id} value=${f.id}>${f.sigla} · ${f.uni}</option>`; })}
            </select>${Msg(show('fac'))}</div>
          <div className="field"><label htmlFor="s-car">Carrera *</label>
            <select id="s-car" className=${'input' + (show('car') ? ' err' : '')} disabled=${!fac} value=${T.car} onChange=${function (e) { set({ car: e.target.value, mat: '' }, 'car'); }}>
              <option value="" disabled>${fac ? 'Elegí la carrera' : 'Primero elegí la facultad'}</option>
              ${(fac ? fac.carreras : []).map(function (x) { return html`<option key=${x.sigla} value=${x.sigla}>${x.nombre}</option>`; })}
            </select>${Msg(show('car'))}</div>
          <div className="field"><label htmlFor="s-mat">Materia *</label>
            <select id="s-mat" className=${'input' + (show('mat') ? ' err' : '')} disabled=${!T.car} value=${T.mat} onChange=${function (e) { set({ mat: e.target.value, cat: '' }, 'mat'); }}>
              <option value="" disabled>${T.car ? 'Elegí la materia' : 'Primero elegí la carrera'}</option>
              ${mats.map(function (m) { return html`<option key=${m} value=${m}>${m}</option>`; })}
            </select>${Msg(show('mat'))}</div>
          <div className="field" role="radiogroup" aria-labelledby="s-cat-l">
            <span id="s-cat-l" className="label">Cátedra *</span>
            ${catOpts.length > 4 ? html`<select className=${'input' + (show('cat') ? ' err' : '')} aria-labelledby="s-cat-l" disabled=${!T.mat} value=${T.cat} onChange=${function (e) { set({ cat: e.target.value }, 'cat'); }}>
                <option value="" disabled>${T.mat ? 'Elegí la cátedra' : 'Primero elegí la materia'}</option>
                ${catOpts.map(function (k) { return html`<option key=${k} value=${k}>${k}</option>`; })}
              </select>`
            : html`<div className="chips wrap">${catOpts.map(function (k) { var on = T.cat === k;
              return html`<button key=${k} type="button" role="radio" aria-checked=${on} className=${'chip big' + (on ? ' on' : '')} onClick=${function () { set({ cat: k }, 'cat'); }}>${on ? I('check', 13, { sw: 3.2 }) : null}${k}</button>`; })}</div>`}

        <button type="button" className="icon-btn" aria-label="Cerrar ayuda" onClick=${close}>${I('x', 16, { sw: 2.6 })}</button></div>
      ${pasos.map(function (p, i) { return html`<div key=${i} className="row dashed-bottom" style=${{ gap: 14, alignItems: 'flex-start', paddingBottom: 14 }}>
        <span style=${{ flexShrink: 0, width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, fontWeight: 900, background: colores[i] }}>0${i + 1}</span>
        <span className="stack" style=${{ gap: 3 }}><span style=${{ fontSize: 14, fontWeight: 800 }}>${p[0]}</span><span className="muted">${p[1]}</span></span>
      </div>`; })}
      <span className="hint">¿Querés probar sin registrarte? En la pantalla de inicio de sesión elegí una cuenta de prueba: secundaria o facultad.</span>
      <button type="button" className="btn btn-navy btn-block" onClick=${close}>Entendido</button>
    </div>
  </div>`;
}
function LogoutSheet(c) {
  function close() { c.up({ sheet: null }); }
  return html`<div className="veil" onClick=${function (e) { if (e.target === e.currentTarget) close(); }}>
    <div className="sheet" role="alertdialog" aria-modal="true" aria-labelledby="lo-t" aria-describedby="lo-d">
      <span id="lo-t" style=${{ fontSize: 18, fontWeight: 900 }}>¿CERRAR SESIÓN?</span>
      <span id="lo-d" className="muted">Tus guardados quedan en tu cuenta. Para volver a entrar vas a necesitar tu email y contraseña.</span>
      <div className="grid2" style=${{ gap: 10 }}>
        <button type="button" className="btn btn-ghost" onClick=${close} autoFocus>Cancelar</button>
        <button type="button" className="btn btn-navy" onClick=${c.logout}>Cerrar sesión</button>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>

</body>
</html>
